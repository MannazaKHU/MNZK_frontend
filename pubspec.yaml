name: lh02_frontend
description: LH02 팀 공통 Flutter 기본 실행 환경
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/mannami_only.png
    - assets/images/mainscreen.png
    - assets/screens/2-1-1/
    - assets/screens/2-1-2/
    - assets/screens/2-1-3/
    - assets/screens/3-1/
    - assets/screens/3-2/
   

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700

    - family: OngleipMimi
      fonts:
        - asset: assets/fonts/OngleipMimi.ttf
